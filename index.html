<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aynı Frekans</title>
<meta name="description" content="Birbirinizi ne kadar tanıyorsunuz? 2–8 kişilik, sunucusuz, 6 haneli kodla bağlanılan tahmin oyunu.">
<meta name="theme-color" content="#16113A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316113A'/%3E%3Cpath d='M8 32c6-14 10-14 16 0s10 14 16 0 10-14 16 0' fill='none' stroke='%234FD1FF' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M8 32c6 14 10 14 16 0s10-14 16 0 10 14 16 0' fill='none' stroke='%23FF6F91' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#16113A;
  --panel:rgba(255,255,255,.055);
  --panel-2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.13);
  --ink:#F4F0FF;
  --muted:#A9A1D3;
  --dim:#7C74AB;
  --a:#4FD1FF;
  --b:#FF6F91;
  --gold:#FFD166;
  --ok:#62E6A8;
  --bad:#FF8080;
  --display:'Unbounded','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font:400 16px/1.5 var(--body);color:var(--ink);
  background:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.hidden{display:none!important}

#app{
  max-width:580px;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;cursor:pointer;font:700 15px var(--display);letter-spacing:.01em}
.brand svg{width:34px;height:20px;overflow:visible}
.top-r{display:flex;align-items:center;gap:8px}
.pill{font:600 13px var(--display);letter-spacing:.08em;padding:7px 12px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:17px;display:grid;place-items:center}
.timebar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 0 6px;visibility:hidden}
.timebar.on{visibility:visible}
.timebar i{display:block;height:100%;width:100%;background:var(--a);border-radius:4px;transition:width .25s linear,background .3s}
.timebar.low i{background:var(--b)}

/* generic */
.screen{padding-top:6px}
.enter > *{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.05s}
.enter > *:nth-child(3){animation-delay:.1s}
.enter > *:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:12px 20px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel-2);
  font:600 16px/1.1 var(--body);cursor:pointer;text-decoration:none;
  transition:transform .12s ease,background .2s,border-color .2s,opacity .2s;
}
.btn:hover{background:rgba(255,255,255,.15)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent;font:700 16px/1.1 var(--display);letter-spacing:.01em}
.btn.primary:hover{background:#fff}
.btn.big{width:100%;min-height:60px;font-size:17px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.ghost{background:none}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px;font-size:14px}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px}
.muted{color:var(--muted)}
.hint{color:var(--dim);font-size:14px;margin:10px 0 0}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 0 0;text-align:center}

.field{
  width:100%;font:500 18px/1.3 var(--body);
  background:rgba(0,0,0,.24);border:1.5px solid var(--line);border-radius:16px;
  padding:15px 16px;outline:none;transition:border-color .2s,background .2s;
}
.field::placeholder{color:var(--dim)}
.field:focus{border-color:var(--c,var(--a));background:rgba(0,0,0,.32)}
.field:disabled{opacity:.75}

.av{
  --c:var(--a);
  display:inline-grid;place-items:center;flex:none;
  width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1;
  background:color-mix(in srgb,var(--c) 20%,transparent);
  box-shadow:inset 0 0 0 2px var(--c);
}
.av.sm{width:30px;height:30px;font-size:16px}
.av.xs{width:24px;height:24px;font-size:13px;box-shadow:inset 0 0 0 1.5px var(--c)}
.av.lg{width:64px;height:64px;font-size:34px;box-shadow:inset 0 0 0 3px var(--c)}

/* home */
.hero{position:relative;padding:8px 0 4px}
.wave{display:block;width:100%;height:120px;overflow:visible}
.wave path{fill:none;stroke-width:4;stroke-linecap:round;mix-blend-mode:screen}
.wave .wa{stroke:var(--wa,var(--a));filter:drop-shadow(0 0 6px var(--wa,var(--a)))}
.wave .wb{stroke:var(--wb,var(--b));filter:drop-shadow(0 0 6px var(--wb,var(--b)))}
.title{font:800 clamp(46px,14vw,76px)/.95 var(--display);letter-spacing:-.03em;margin:6px 0 16px}
.lede{font-size:17px;color:var(--muted);max-width:34em;margin:0 0 26px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:20px}
.panel + .panel{margin-top:14px}
.avatars{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.avatars::-webkit-scrollbar{display:none}
.avpick{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:rgba(0,0,0,.2);font-size:23px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.avpick.on{border-color:var(--ink);background:rgba(255,255,255,.14);transform:scale(1.08)}
.stack{display:grid;gap:12px;margin-top:16px}
.join-row{display:flex;gap:10px}
.code-in{
  flex:1;min-width:0;text-align:center;font:700 26px/1 var(--display);letter-spacing:.32em;
  padding:14px 6px 14px 14px;background:rgba(0,0,0,.24);border:1.5px solid var(--line);border-radius:16px;outline:none;
}
.code-in::placeholder{color:rgba(255,255,255,.18)}
.code-in:focus{border-color:var(--a)}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:14px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.invite{border-color:color-mix(in srgb,var(--a) 50%,transparent);background:color-mix(in srgb,var(--a) 9%,transparent)}
.invite b{font-family:var(--display);letter-spacing:.08em}
.notice{background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:16px;padding:14px 16px;margin:0 0 14px;font-size:15px}
.how{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
.how summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
.how summary::after{content:"+";font:600 20px var(--display);color:var(--muted)}
.how[open] summary::after{content:"–"}
.how summary::-webkit-details-marker{display:none}
.how ol{margin:0;padding-left:20px;color:var(--muted)}
.how li{margin:0 0 10px}
.how li b{color:var(--ink);font-weight:600}
.foot-note{text-align:center;color:var(--dim);font-size:13px;margin-top:26px}

/* connecting */
.center{min-height:56vh;display:grid;place-content:center;text-align:center;gap:18px}
.spinner{width:64px;height:64px;margin:0 auto}
.spinner path{fill:none;stroke-width:4;stroke-linecap:round}
.spinner .wa{stroke:var(--a);stroke-dasharray:24 80;animation:dash 1.2s linear infinite}
.spinner .wb{stroke:var(--b);stroke-dasharray:24 80;animation:dash 1.2s linear infinite reverse}
@keyframes dash{to{stroke-dashoffset:-104}}

/* lobby */
.code-box{text-align:center;padding:10px 0 22px}
.code{display:inline-flex;gap:.28em;background:none;border:0;cursor:pointer;font:800 clamp(52px,16vw,78px)/1 var(--display);letter-spacing:.05em;padding:6px 10px;margin:2px 0 14px;border-radius:18px}
.code:hover{background:var(--panel)}
.code-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sec{margin-top:26px}
.sec h3{display:flex;align-items:baseline;justify-content:space-between;font:600 15px var(--display);margin:0 0 12px}
.sec h3 .muted{font:500 14px var(--body)}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.plist .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.plist li.off{opacity:.45}
.plist li.empty{background:none;border-style:dashed;color:var(--dim);font-size:14px;justify-content:center;min-height:62px}
.avbtn{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{
  text-align:left;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;
  display:grid;gap:4px;transition:border-color .2s,background .2s;
}
.mode .mt{font:600 15px var(--display)}
.mode .md{font-size:13px;color:var(--muted);line-height:1.35}
.mode.on{border-color:var(--ink);background:rgba(255,255,255,.12)}
.mode:disabled{cursor:default}
.mode.on:disabled{opacity:1}
.packs{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;
  border:1.5px dashed rgba(255,255,255,.2);background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--dim);transition:.15s;
}
.chip small{font-weight:500;color:var(--dim)}
.chip:not(.on) > :first-child{filter:grayscale(1);opacity:.6}
.chip.on{color:var(--ink);border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14)}
.chip.on small{color:var(--muted)}
.chip:disabled{cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:12px;padding:10px 6px;cursor:pointer;display:grid;gap:2px;color:var(--muted);font-weight:600}
.seg button small{font-weight:500;font-size:12px;color:var(--dim)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button.on small{color:#4d4775}
.seg button:disabled{cursor:default}
.toggles{display:grid;gap:8px}
.tog{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.tog .tt{flex:1}
.tog .tt b{display:block;font-weight:600}
.tog .tt span{font-size:13px;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on .sw{background:var(--ok)}
.tog.on .sw::after{transform:translateX(18px)}
.tog:disabled{cursor:default}
.est{margin:18px 0 0;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.22);color:var(--muted);font-size:14px}
.est b{color:var(--ink)}
.dock{margin-top:26px}

/* round intro */
.intro{min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.dots{display:flex;gap:8px;margin-bottom:22px}
.dots i{width:34px;height:6px;border-radius:6px;background:rgba(255,255,255,.14)}
.dots i.done{background:rgba(255,255,255,.45)}
.dots i.cur{background:var(--ink)}
.kicker{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 6px}
.big-title{font:800 clamp(52px,17vw,96px)/.95 var(--display);letter-spacing:-.03em;margin:0 0 16px}
.intro p{font-size:18px;color:var(--muted);margin:0;max-width:26em}
.x2{display:inline-block;margin-top:18px;font:700 15px var(--display);color:var(--bg);background:var(--gold);padding:8px 14px;border-radius:999px}

/* answer */
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);background:var(--panel-2);padding:6px 11px;border-radius:999px;font-size:13px}
.secs{font:600 14px var(--display);color:var(--ink);min-width:3ch;text-align:right}
.status{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.st{position:relative}
.st .av{opacity:.5;transition:opacity .2s}
.st.done .av{opacity:1}
.st.done::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#0d2a1d;font:800 10px/16px var(--body);text-align:center}
.st.off .av{opacity:.2;filter:grayscale(1)}
.q{font:600 clamp(23px,6.2vw,31px)/1.22 var(--display);letter-spacing:-.015em;margin:18px 0 22px;text-wrap:balance;overflow-wrap:anywhere}
.q.sm{font-size:clamp(19px,5vw,23px);margin:14px 0 18px}
.multnote{display:inline-block;margin:-8px 0 18px;font:600 13px var(--display);color:var(--gold)}
.block{margin:0 0 16px}
.block-h{display:flex;align-items:center;gap:10px;font-weight:600;margin:0 0 10px;font-size:16px}
.block.guess{padding:16px;border-radius:24px;background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{
  --c:var(--a);
  min-height:52px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);
  cursor:pointer;text-align:left;font-weight:600;font-size:15px;line-height:1.25;transition:background .15s,border-color .15s,transform .1s;
}
.opt:active{transform:scale(.98)}
.opt.on{background:var(--c);border-color:var(--c);color:#130f30}
.opt:disabled{cursor:default}
.opt:disabled:not(.on){opacity:.45}
.scale{padding:6px 2px 0}
.scale input{width:100%;-webkit-appearance:none;appearance:none;height:34px;background:none;cursor:pointer;margin:0}
.scale input::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--c,var(--a)) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
.scale input::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.14)}
.scale input::-moz-range-progress{height:8px;border-radius:8px;background:var(--c,var(--a))}
.scale input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--c,var(--a));margin-top:-11px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.scale input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--c,var(--a))}
.scale input:disabled{cursor:default;opacity:.8}
.scale-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:4px}
.scale-row span{flex:1}
.scale-row span:last-child{text-align:right}
.scale-row output{font:700 24px var(--display);color:var(--ink);min-width:2ch;text-align:center}
.jokers{display:flex;gap:8px;margin:4px 0 16px}
.jk{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:16px;border:1.5px dashed var(--line);background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.jk b{font:700 14px var(--display);color:var(--ink)}
.jk.on{border-style:solid;border-color:var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.jk:disabled{opacity:.35;cursor:default}
.waiting{text-align:center;padding:18px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
.waiting .ok{font:600 17px var(--display);margin-bottom:4px}
.waiting .row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* reveal */
.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:16px;position:relative;overflow:hidden}
.card.mine{border-color:rgba(255,255,255,.3)}
.link-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.link-row svg{flex:1;height:14px;min-width:30px}
.link-row .nm{font-size:13px;font-weight:600;color:var(--muted);max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say{padding:12px;border-radius:16px;background:rgba(0,0,0,.22);min-width:0}
.say .who{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.say .txt{font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.say.empty .txt{color:var(--dim);font-weight:500}
.track{position:relative;height:56px;margin:4px 6px 0}
.track .ln{position:absolute;left:0;right:0;top:27px;height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
.track .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font:700 13px var(--display)}
.track .mk i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg);margin-top:4px}
.track .mk.up{top:auto;bottom:0}
.track .mk.up i{order:-1;margin:0 0 4px}
.track-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:10px;margin-top:8px}
.track-legend span{display:flex;align-items:center;gap:6px}
.track-legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;min-height:40px}
.res .verdict{font-weight:700;font-size:15px}
.res .pts{font:800 26px var(--display);color:var(--gold)}
.res .pts small{font:600 12px var(--body);color:var(--muted);margin-left:6px}
.res.miss .pts{color:var(--dim)}
.res.wait{color:var(--muted);font-size:14px;justify-content:flex-start}
.judge{margin-top:12px}
.judge p{margin:0 0 8px;font-weight:600;font-size:15px}
.judge .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.judge .btn{min-height:50px;padding:8px;font-size:14px;flex-direction:column;gap:2px;border-radius:16px}
.judge .btn small{font-size:12px;color:var(--muted);font-weight:500}
.judge .j2{border-color:var(--ok)}
.judge .j1{border-color:var(--gold)}
.match{margin-top:12px;padding:10px 12px;border-radius:14px;font-size:14px;font-weight:600;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--b) 22%,transparent))}
.reacts{display:flex;justify-content:center;gap:6px;margin:18px 0 6px}
.react{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:22px;cursor:pointer;transition:transform .12s}
.react:active{transform:scale(1.25)}
.mini{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:14px 0 4px}
.mini span{display:flex;align-items:center;gap:6px;font:700 15px var(--display)}
.mini em{font:600 12px var(--body);color:var(--gold);font-style:normal}
.dock .count{text-align:center;color:var(--muted);font-size:14px;margin-top:8px}

/* scoreboard */
.board{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.board li{display:grid;grid-template-columns:28px auto 1fr auto;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.board li .bar{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c) 16%,transparent);z-index:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.board li > *{position:relative;z-index:1}
.board .rk{font:700 15px var(--display);color:var(--muted);text-align:center}
.board .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font:800 22px var(--display)}
.board li.first .rk{color:var(--gold)}
.next-up{margin:22px 0 0;padding:16px;border-radius:20px;border:1px dashed var(--line);color:var(--muted)}
.next-up b{color:var(--ink);font-family:var(--display);font-weight:600}

/* final */
.final{text-align:center}
.final .wave{height:110px}
.pct{font:800 clamp(64px,22vw,110px)/1 var(--display);letter-spacing:-.04em;margin:6px 0 4px}
.tier{font:600 20px var(--display);margin:0 0 4px}
.tier-d{color:var(--muted);margin:0 auto 22px;max-width:26em}
.winner{font:700 22px var(--display);margin:24px 0 14px}
.final .board{text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 8px}
.stat b{display:block;font:800 22px var(--display)}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.recap{text-align:left;margin-top:24px}
.recap > summary{cursor:pointer;font-weight:600;padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);list-style:none}
.recap > summary::-webkit-details-marker{display:none}
.recap ol{margin:12px 0 0;padding:0 0 0 22px;display:grid;gap:14px}
.recap li{color:var(--muted)}
.recap li > b{color:var(--ink);display:block;margin-bottom:6px}
.rc{font-size:14px;padding:4px 0 6px;line-height:1.4}
.rc .ans{color:var(--ink)}
.rc .who{font-weight:600;color:var(--ink)}
.rc .gs{font-size:13px;padding-left:24px}
.rc .ok{color:var(--ok)}
.rc .meh{color:var(--gold)}
.rc .no{color:var(--dim)}
.btn-row{display:grid;gap:10px;margin-top:22px}

/* overlays */
#toasts{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toastIn .3s ease both;text-align:center}
.toast.out{animation:toastOut .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.fl{position:absolute;bottom:-40px;font-size:36px;animation:floatUp 2.4s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-12vh) scale(1.1)}100%{transform:translateY(-75vh) translateX(var(--dx)) scale(1);opacity:0}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,7,30,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal .box{background:#221A55;border:1px solid var(--line);border-radius:26px;padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.modal h3{font:600 19px var(--display);margin:0 0 8px}
.modal p{color:var(--muted);margin:0 0 18px}
.modal .row{display:grid;gap:8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

@media (max-width:380px){
  .pair{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .modes{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

function poolFor(settings, n) {
  const packs = new Set(settings.packs);
  return QUESTIONS.filter(q => packs.has(q.pack) && !(q.duo && n > 2));
}
function pickQ(pool, depth, type, taken, boost, packCount) {
  const tiers = [
    q => q.depth === depth && q.type === type,
    q => Math.abs(q.depth - depth) === 1 && q.type === type,
    q => q.depth === depth,
    q => Math.abs(q.depth - depth) <= 1,
    () => true,
  ];
  for (const f of tiers) {
    const c = pool.filter(q => !taken.has(q.id) && f(q));
    if (c.length) return weighted(c, q => (boost[q.pack] || 1) / (1 + (packCount[q.pack] || 0) * .6));
  }
  return null;
}
function typeSlots(mix, n) {
  const keys = Object.keys(mix);
  const raw = keys.map(k => mix[k] * n);
  const cnt = raw.map(Math.floor);
  let left = n - cnt.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - cnt[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { cnt[i]++; left--; } });
  const out = [];
  keys.forEach((k, i) => { for (let j = 0; j < cnt[i]; j++) out.push(k); });
  shuffle(out);
  // aynı türden üç soru üst üste gelmesin
  for (let i = 2; i < out.length; i++) {
    if (out[i] === out[i - 1] && out[i] === out[i - 2]) {
      const j = out.findIndex((t, x) => x > i && t !== out[i]);
      if (j > -1) [out[i], out[j]] = [out[j], out[i]];
    }
  }
  return out;
}
function buildRounds(settings, n, used) {
  const pool = poolFor(settings, n);
  const boost = (MODES[settings.mode] || {}).boost || {};
  const per = LENGTHS[settings.length].per;
  const taken = new Set(used), packCount = {};
  return ROUNDS.map(R => {
    const qs = [];
    for (const type of typeSlots(R.mix, per)) {
      const q = pickQ(pool, R.depth, type, taken, boost, packCount);
      if (q) { qs.push(q); taken.add(q.id); packCount[q.pack] = (packCount[q.pack] || 0) + 1; }
    }
    return {name: R.name, depth: R.depth, qs};
  });
}

function setLocal(name, msg = '') { localScreen = name; connectMsg = msg; if (!view) { lastKey = ''; render(); } }

function screenKey() {
  if (!view) return 'local:' + localScreen + ':' + connectMsg + ':' + homeError + ':' + inviteCode;
  const s = view, g = s.g;
  if (s.phase === 'answer') return `answer:${g.num}:${g.q.id}:${g.subs[myPid] ? 's' : 'd'}`;
  return `${s.phase}:${g ? g.num : 0}:${g ? g.r : 0}`;
}
function render() {
  const key = screenKey(), fresh = key !== lastKey, scr = $('#screen');
  if (!fresh && view && view.phase === 'answer') { patchAnswer(); updateChrome(); return; }
  if (!fresh && !view) return;
  const prevPhase = lastKey.split(':')[0];
  lastKey = key;
  let html;
  if (!view) html = localScreen === 'connecting' ? viewConnecting() : viewHome();
  else html = ({lobby: viewLobby, intro: viewIntro, answer: viewAnswer, reveal: viewReveal, roundEnd: viewRoundEnd, final: viewFinal})[view.phase]();
  scr.classList.toggle('enter', fresh);
  scr.innerHTML = html;
  if (fresh && prevPhase !== key.split(':')[0]) window.scrollTo({top: 0});
  updateChrome();
  startWaves();
  if (fresh && view && view.phase === 'answer' && !view.g.subs[myPid] && view.g.q.type === 'open' && matchMedia('(hover:hover)').matches) {
    const el = $('[data-in="mine"]'); el && el.focus({preventScroll: true});
  }
}
function updateChrome() {
  const pill = $('#roomPill');
  if (view && view.code) { pill.textContent = fmtCode(view.code); pill.classList.remove('hidden'); }
  else pill.classList.add('hidden');
  $('#soundBtn').textContent = Sound.on ? '🔊' : '🔇';
}

/* ---------- Ana ekran ---------- */
function viewHome() {
  const err = homeError ? `<div class="notice" role="alert">${esc(homeError)}</div>` : '';
  const avatars = `<div class="avatars" role="radiogroup" aria-label="Avatar seç">${AVATARS.map(a =>
    `<button class="avpick ${a === myAvatar ? 'on' : ''}" data-act="pickAv" data-av="${a}" role="radio" aria-checked="${a === myAvatar}">${a}</button>`).join('')}</div>`;
  const join = inviteCode ? `
    <div class="panel invite">
      <p style="margin:0 0 14px">Seni <b>${fmtCode(inviteCode)}</b> numaralı odaya davet ettiler.</p>
      <button class="btn primary big" data-act="joinInvite">Odaya katıl</button>
      <div style="text-align:center;margin-top:6px"><button class="link" data-act="dropInvite">Başka bir kod gir ya da oda kur</button></div>
    </div>` : `
    <div class="panel">
      <button class="btn primary big" data-act="create">Oda kur</button>
      <div class="or" style="margin:16px 0 12px">ya da koda katıl</div>
      <div class="join-row">
        <input id="codeIn" class="code-in" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" aria-label="6 haneli oda kodu">
        <button class="btn" data-act="join">Katıl</button>
      </div>
    </div>`;
  return `
  <section class="hero">
    <svg class="wave" data-wave="hero" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"><path class="wa"/><path class="wb"/></svg>
    <h1 class="title">Aynı<br>Frekans</h1>
    <p class="lede">Birbirinizi ne kadar tanıyorsunuz? Herkes kendi cevabını yazar, sonra eşleştiği kişinin ne yazdığını tahmin eder. 2–8 kişi, uzaktan, kurulum yok.</p>
  </section>
  <div>
    ${err}
    <div class="panel">
      <label class="lbl" for="nameIn">Adın</label>
      <input id="nameIn" class="field" maxlength="16" autocomplete="nickname" placeholder="Örneğin Deniz" value="${esc(myName)}">
      <div class="lbl" style="margin-top:16px">Avatarın</div>
      ${avatars}
    </div>
    <div style="margin-top:14px">${join}</div>
  </div>
  <details class="how">
    <summary>Nasıl oynanır?</summary>
    <ol>
      <li><b>Biri oda kurar</b> ve 6 haneli kodu paylaşır. Diğerleri kodu girip katılır. Sunucu kurmana gerek yok.</li>
      <li><b>Her soruda iki şey yazarsın:</b> kendi cevabını ve eşleştiğin kişinin ne cevap vereceğine dair tahminini. İki kişiyseniz birbirinizi tahmin edersiniz; kalabalıksanız eşleşmeler her soruda değişir.</li>
      <li><b>Cevaplar açılır.</b> Açık uçlu sorularda tahmini, hakkında tahmin yapılan kişi puanlar: bildi 2, yakın 1 puan. Seçmeli ve ölçekli sorular kendiliğinden puanlanır.</li>
      <li><b>Üç tur var:</b> Isınma, Keşif ve Final. Sorular tur tur derinleşir; finalde puanlar iki katına çıkar.</li>
      <li><b>Jokerler:</b> herkesin bir 🔄 soru değiştirme ve bir ×2 jokeri vardır. Kendinden emin olduğun tahminde ×2'yi kullan.</li>
    </ol>
  </details>
  <p class="foot-note">Oyun verisi doğrudan tarayıcılar arasında akar.</p>`;
}
function viewConnecting() {
  return `<section class="center">
    <svg class="spinner" viewBox="0 0 64 64" aria-hidden="true"><path class="wa" d="M4 32c7-16 11-16 14 0s7 16 14 0 7-16 14 0 7 16 14 0"/><path class="wb" d="M4 32c7 16 11 16 14 0s7-16 14 0 7 16 14 0 7-16 14 0"/></svg>
    <div style="font:600 18px var(--display)">${esc(connectMsg)}</div>
    <div><button class="btn ghost sm" data-act="leaveNow">Vazgeç</button></div>
  </section>`;
}

/* ---------- Lobi ---------- */
function viewLobby() {
  const s = view, S = s.settings, host = isHost(), dis = host ? '' : 'disabled';
  const n = s.players.length, total = LENGTHS[S.length].per * 3, mins = Math.max(5, Math.round(total * TIMERS[S.timer].est));
  const canLink = /^https?:/.test(location.protocol);
  const canStart = s.players.filter(p => p.connected).length >= 2 && S.packs.length > 0;
  const players = s.players.map(p => `
    <li class="${p.connected ? '' : 'off'}">
      ${p.id === myPid ? `<button class="avbtn" data-act="cycleAv" aria-label="Avatarını değiştir">${av(p)}</button>` : av(p)}
      <span class="nm">${esc(p.name)}</span>
      ${p.id === s.hostId ? '<span class="badge">oda sahibi</span>' : ''}
      ${p.id === myPid ? '<span class="badge">sen</span>' : ''}
    </li>`).join('') + (n < 2 ? `<li class="empty">Arkadaşın kodu girince burada görünecek</li>` : '');
  const modes = Object.entries(MODES).map(([id, m]) => `
    <button class="mode ${S.mode === id ? 'on' : ''}" data-act="mode" data-v="${id}" ${dis} aria-pressed="${S.mode === id}">
      <span class="mt">${m.emoji} ${m.name}</span><span class="md">${m.desc}</span>
    </button>`).join('');
  const packs = PACKS.map(p => {
    const c = QUESTIONS.filter(q => q.pack === p.id && !(q.duo && n > 2)).length;
    return `<button class="chip ${S.packs.includes(p.id) ? 'on' : ''}" data-act="pack" data-v="${p.id}" ${dis} aria-pressed="${S.packs.includes(p.id)}"><span>${p.emoji}</span> ${p.name} <small>${c}</small></button>`;
  }).join('');
  const seg = (key, obj, sub) => `<div class="seg" role="group">${Object.entries(obj).map(([id, o]) =>
    `<button class="${S[key] === id ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${id}" ${dis} aria-pressed="${S[key] === id}">${o.name}<small>${sub(o)}</small></button>`).join('')}</div>`;
  const tog = (key, title, sub) => `
    <button class="tog ${S[key] ? 'on' : ''}" data-act="toggle" data-k="${key}" ${dis} aria-pressed="${!!S[key]}">
      <span class="tt"><b>${title}</b><span>${sub}</span></span><span class="sw"></span>
    </button>`;
  return `
  <section class="code-box">
    <div class="lbl">Oda kodu</div>
    <button class="code" data-act="copyCode" aria-label="Oda kodunu kopyala"><span>${s.code.slice(0, 3)}</span><span>${s.code.slice(3)}</span></button>
    <div class="code-actions">
      <button class="btn sm" data-act="copyCode">Kodu kopyala</button>
      ${canLink ? `<button class="btn sm" data-act="copyLink">Davet linkini kopyala</button>` : ''}
      ${canLink && navigator.share ? `<button class="btn sm" data-act="share">Paylaş</button>` : ''}
    </div>
    <p class="hint">${canLink ? 'Kodu ya da linki gönder; açan herkes doğrudan odaya gelir.' : 'Arkadaşın bu sayfayı açıp "koda katıl" alanına kodu yazsın.'}</p>
  </section>
  <section class="sec">
    <h3>Oyuncular <span class="muted">${n}/${MAX_PLAYERS}</span></h3>
    <ul class="plist">${players}</ul>
  </section>
  <section class="sec">
    <h3>Mod ${host ? '' : '<span class="muted">oda sahibi seçiyor</span>'}</h3>
    <div class="modes">${modes}</div>
    <h3 style="margin-top:22px">Soru paketleri <span class="muted">${S.mode === 'ozel' ? 'özel seçim' : ''}</span></h3>
    <div class="packs">${packs}</div>
    <h3 style="margin-top:22px">Uzunluk</h3>
    ${seg('length', LENGTHS, o => `${o.per * 3} soru`)}
    <h3 style="margin-top:22px">Süre</h3>
    ${seg('timer', TIMERS, o => o.sub)}
    <div class="toggles" style="margin-top:14px">
      ${tog('jokers', 'Jokerler', 'Herkese bir 🔄 değiştir ve bir ×2')}
      ${tog('finalDouble', 'Final turunda çift puan', 'Geride kalan son turda yetişebilir')}
    </div>
    <p class="est"><b>${total} soru</b>, 3 tur. Yaklaşık <b>${mins} dakika</b> sürer.</p>
  </section>
  <section class="dock">
    ${host ? `<button class="btn primary big" data-act="start" ${canStart ? '' : 'disabled'}>Oyunu başlat</button>
      <p class="hint" style="text-align:center">${!S.packs.length ? 'En az bir soru paketi seç.' : n < 2 ? 'Başlamak için en az bir kişi daha gerekiyor.' : 'Herkes hazırsa başlat.'}</p>`
      : `<div class="waiting"><div class="ok">Hazırsın</div><div class="muted">Oda sahibi başlatınca oyun açılacak.</div></div>`}
    <div style="text-align:center;margin-top:8px"><button class="link" data-act="leave">Odadan çık</button></div>
  </section>`;
}

/* ---------- Tur girişi ---------- */
function viewIntro() {
  const g = view.g, R = ROUNDS[Math.min(g.r, ROUNDS.length - 1)], n = g.rounds.length;
  return `<section class="intro">
    <div class="dots">${g.rounds.map((_, i) => `<i class="${i < g.r ? 'done' : i === g.r ? 'cur' : ''}"></i>`).join('')}</div>
    <p class="kicker">Tur ${g.r + 1} / ${n}</p>
    <h2 class="big-title">${esc(g.roundName)}</h2>
    <p>${esc(R.desc)} ${g.rounds[g.r].n} soru.</p>
    ${g.finalMult > 1 ? '<span class="x2">Bu turda puanlar ×2</span>' : ''}
  </section>`;
}

/* ---------- Cevap ---------- */
function defaultVal(q) { return q.type === 'scale' ? 5 : q.type === 'choice' ? null : ''; }
function inputFor(q, kind, val, disabled, color) {
  const d = disabled ? 'disabled' : '';
  if (q.type === 'choice') {
    return `<div class="opts" role="radiogroup">${q.opts.map((o, i) =>
      `<button type="button" class="opt ${val !== null && val !== undefined && +val === i ? 'on' : ''}" style="--c:${color}" data-act="opt" data-kind="${kind}" data-v="${i}" ${d} role="radio" aria-checked="${val !== null && +val === i}">${esc(o)}</button>`).join('')}</div>`;
  }
  if (q.type === 'scale') {
    const v = val ?? 5;
    return `<div class="scale" style="--c:${color}">
      <input type="range" min="0" max="10" step="1" value="${v}" data-in="${kind}" ${d} style="--p:${v * 10}%" aria-label="${kind === 'mine' ? 'Senin cevabın' : 'Tahminin'}">
      <div class="scale-row"><span>${esc(q.lo)}</span><output data-out="${kind}">${v}</output><span>${esc(q.hi)}</span></div>
    </div>`;
  }
  return `<input class="field" style="--c:${color}" data-in="${kind}" maxlength="80" value="${esc(val ?? '')}" ${d} autocomplete="off" enterkeyhint="${kind === 'mine' ? 'next' : 'send'}" placeholder="${kind === 'mine' ? 'Cevabını yaz' : 'Tahminini yaz'}">`;
}
function statusHTML() {
  const g = view.g;
  return g.order.map(id => {
    const p = VP(id);
    return `<span class="st ${g.subs[id] ? 'done' : ''} ${p.connected ? '' : 'off'}" title="${esc(p.name)}">${av(p, 'sm')}</span>`;
  }).join('');
}
function jokersHTML(vals, submitted) {
  const me = VP(myPid);
  if (!view.settings.jokers) return '';
  const sw = me.jokers.swap, x2 = me.jokers.x2;
  return `<div class="jokers">
    <button class="jk" data-act="swap" ${submitted || sw < 1 ? 'disabled' : ''}>🔄 Soruyu değiştir <b>${sw}</b></button>
    <button class="jk ${vals.x2 ? 'on' : ''}" data-act="x2" ${submitted || x2 < 1 ? 'disabled' : ''} aria-pressed="${!!vals.x2}">×2 Eminim <b>${x2}</b></button>
  </div>`;
}
function waitingHTML() {
  const g = view.g, ids = g.order.filter(id => VP(id).connected), done = ids.filter(id => g.subs[id]).length;
  return `<div class="waiting">
    <div class="ok">Gönderildi</div>
    <div class="muted">${done < ids.length ? `Diğerleri bekleniyor (${done}/${ids.length})` : 'Cevaplar açılıyor…'}</div>
    <div class="row">
      <button class="btn sm" data-act="unsubmit">Düzenle</button>
      ${isHost() && done < ids.length ? '<button class="btn sm ghost" data-act="force">Beklemeden aç</button>' : ''}
    </div>
  </div>`;
}
function viewAnswer() {
  const g = view.g, q = g.q, me = VP(myPid);
  if (!g.order.includes(myPid)) return `<section class="center"><div class="muted">Bu oyunu izliyorsun.</div></section>`;
  const t = VP(g.targets[myPid]), sub = g.subs[myPid], submitted = !!sub;
  const dk = g.num + ':' + q.id;
  if (draft.qid !== dk) draft = {qid: dk, mine: defaultVal(q), guess: defaultVal(q), x2: false};
  const vals = submitted ? sub : draft, pk = PACK[q.pack];
  return `<section>
    <div class="meta"><span class="tag">${pk.emoji} ${pk.name}</span><span>Soru ${g.num}/${g.total} <span class="secs" id="secs"></span></span></div>
    <div class="status" id="status">${statusHTML()}</div>
    <h2 class="q">${esc(q.text)}</h2>
    ${g.finalMult > 1 ? '<div class="multnote">Final turu: puanlar ×2</div>' : ''}
  </section>
  <section>
    <div class="block">
      <div class="block-h">${av(me, 'sm')} Senin cevabın</div>
      ${inputFor(q, 'mine', vals.mine, submitted, me.color)}
    </div>
    <div class="block guess" style="--c:${t.color}">
      <div class="block-h">${av(t, 'sm')} ${esc(gen(t.name))} cevabı ne sence?</div>
      ${inputFor(q, 'guess', vals.guess, submitted, t.color)}
    </div>
  </section>
  <section>
    <div id="jokers">${jokersHTML(vals, submitted)}</div>
    <div id="submitArea">${submitted ? waitingHTML() : `<button class="btn primary big" data-act="submit">Gönder</button><p class="err" id="formErr"></p>`}</div>
  </section>`;
}
function patchAnswer() {
  const st = $('#status'); if (st) st.innerHTML = statusHTML();
  const submitted = !!view.g.subs[myPid];
  const jk = $('#jokers'); if (jk) jk.innerHTML = jokersHTML(submitted ? view.g.subs[myPid] : draft, submitted);
  if (submitted) { const sa = $('#submitArea'); if (sa) sa.innerHTML = waitingHTML(); }
}
function submitAnswer(auto = false) {
  const q = view.g.q;
  if (!auto) {
    const ok = q.type === 'scale' || (hasAns(q, draft.mine) && hasAns(q, draft.guess));
    if (!ok) {
      const e = $('#formErr'); if (e) { e.textContent = q.type === 'choice' ? 'İki soruda da bir seçenek seç.' : 'Önce iki alanı da doldur.'; }
      const b = $('[data-act="submit"]'); if (b) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
      return;
    }
    Sound.play('send');
  }
  act('submit', {mine: draft.mine, guess: draft.guess, x2: draft.x2});
}

/* ---------- Açılış (reveal) ---------- */
function linkSVG(c1, c2) {
  const id = 'lg' + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M0 7 Q6.25 0 12.5 7 T25 7 T37.5 7 T50 7 T62.5 7 T75 7 T87.5 7 T100 7" fill="none" stroke="url(#${id})" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function cardHTML(c) {
  const q = view.g.q, G = VP(c.g), T = VP(c.t);
  const gl = youOr(G, 'Senin tahminin', gen(G.name) + ' tahmini');
  const tl = youOr(T, 'Senin cevabın', gen(T.name) + ' cevabı');
  let body;
  if (q.type === 'scale' && hasAns(q, c.ans)) {
    const gv = hasAns(q, c.guess) ? +c.guess : null, tv = +c.ans;
    body = `<div class="track">
        <div class="ln"></div>
        <div class="mk" style="left:${tv * 10}%;--c:${T.color}">${tv}<i></i></div>
        ${gv !== null ? `<div class="mk up" style="left:${gv * 10}%;--c:${G.color}"><i></i>${gv}</div>` : ''}
      </div>
      <div class="track-legend"><span style="--c:${T.color}"><i></i>${esc(tl)}</span><span style="--c:${G.color}"><i></i>${esc(gl)}${gv === null ? ': boş' : ''}</span></div>
      <div class="track-legend"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`;
  } else {
    const gv = showVal(q, c.guess), tv = showVal(q, c.ans);
    body = `<div class="pair">
      <div class="say ${gv ? '' : 'empty'}"><div class="who">${esc(gl)}</div><div class="txt">${gv ? esc(gv) : 'Boş bıraktı'}</div></div>
      <div class="say ${tv ? '' : 'empty'}"><div class="who">${esc(tl)}</div><div class="txt">${tv ? esc(tv) : 'Cevap yok'}</div></div>
    </div>`;
  }
  let foot = '';
  if (c.state === 'na') foot = `<div class="res wait">${esc(youOr(T, 'Cevap vermediğin için', T.name + ' cevap vermediği için'))} bu tahmin puanlanmadı.</div>`;
  else if (c.state === 'pending') {
    foot = c.t === myPid
      ? `<div class="judge"><p>${esc(gen(G.name))} tahmini tuttu mu?</p><div class="row">
          <button class="btn j2" data-act="judge" data-v="2">🎯 Bildi<small>+2</small></button>
          <button class="btn j1" data-act="judge" data-v="1">🤏 Yakın<small>+1</small></button>
          <button class="btn" data-act="judge" data-v="0">✗ Bilemedi<small>0</small></button>
        </div></div>`
      : `<div class="res wait">${esc(youOr(T, 'Sen', T.name))} puanlıyor…</div>`;
  } else {
    const verdict = c.how === 'skip' ? 'Puanlanmadı' : !hasAns(q, c.guess) ? 'Tahmin yok'
      : c.base === 2 ? (q.type === 'scale' && +c.guess === +c.ans ? '🎯 Tam isabet' : '🎯 Bildi') : c.base === 1 ? '🤏 Yakın' : '✗ Bilemedi';
    const notes = [c.x2 ? '×2 joker' : '', c.mult > 1 && view.g.finalMult > 1 ? 'final ×2' : ''].filter(Boolean).join(', ');
    foot = `<div class="res ${c.base ? '' : 'miss'}"><span class="verdict">${verdict}</span><span class="pts">${c.pts ? '+' + c.pts : '0'}${notes && c.base ? `<small>${notes}</small>` : ''}</span></div>`;
  }
  const other = c.g === myPid ? T : c.t === myPid ? G : null;
  const match = !c.match ? '' : `<div class="match">⚡ Aynı frekans: ${other ? esc(other.name) + ' ile aynı cevabı verdin' : esc(G.name) + ' ve ' + esc(T.name) + ' aynı cevabı vermiş'}</div>`;
  return `<article class="card ${c.t === myPid || c.g === myPid ? 'mine' : ''}">
    <div class="link-row">${av(G, 'xs')}<span class="nm">${esc(youOr(G, 'Sen', G.name))}</span>${linkSVG(G.color, T.color)}<span class="nm">${esc(youOr(T, 'Sen', T.name))}</span>${av(T, 'xs')}</div>
    ${body}${foot}${match}
  </article>`;
}
function miniScores() {
  const g = view.g, delta = {};
  (g.cards || []).forEach(c => { if (c.state === 'done' && c.pts) delta[c.g] = (delta[c.g] || 0) + c.pts; });
  return `<div class="mini">${[...view.players].sort((a, b) => b.score - a.score).map(p =>
    `<span>${av(p, 'xs')} ${p.score}${delta[p.id] ? `<em>+${delta[p.id]}</em>` : ''}</span>`).join('')}</div>`;
}
function viewReveal() {
  const g = view.g, q = g.q, pk = PACK[q.pack];
  const rank = c => c.t === myPid ? 0 : c.g === myPid ? 1 : 2;
  const cards = [...g.cards].sort((a, b) => rank(a) - rank(b));
  const done = cards.every(c => c.state !== 'pending');
  const ids = g.order.filter(id => VP(id).connected), rc = ids.filter(id => view.ready[id]).length, iAmReady = !!view.ready[myPid];
  const lastInRound = g.qi === g.rounds[g.r].n - 1, lastAll = lastInRound && g.r === g.rounds.length - 1;
  const nextLabel = lastAll ? 'Sonuçları gör' : lastInRound ? 'Tur sonucuna geç' : 'Sonraki soru';
  return `<section>
    <div class="meta"><span class="tag">${pk.emoji} ${pk.name}</span><span>Soru ${g.num}/${g.total}</span></div>
    <h2 class="q sm">${esc(q.text)}</h2>
  </section>
  <section class="cards">${cards.map(cardHTML).join('')}</section>
  <section>
    <div class="reacts">${REACTS.map(e => `<button class="react" data-act="react" data-e="${e}" aria-label="Tepki: ${e}">${e}</button>`).join('')}</div>
    ${miniScores()}
  </section>
  <section class="dock">
    ${done ? `<button class="btn primary big" data-act="ready" ${iAmReady ? 'disabled' : ''}>${iAmReady ? 'Diğerleri bekleniyor' : nextLabel}</button>
      <div class="count">${rc}/${ids.length} kişi hazır</div>${isHost() && rc < ids.length ? '<div class="count"><button class="link" data-act="force">Beklemeden geç</button></div>' : ''}`
      : `<div class="count">Puanlamalar bekleniyor…${isHost() ? ' <button class="link" data-act="force">Atla</button>' : ''}</div>`}
  </section>`;
}

/* ---------- Skor tablosu ---------- */
function boardHTML() {
  const ps = [...view.players].sort((a, b) => b.score - a.score), max = Math.max(1, ...ps.map(p => p.score));
  let rank = 0, prev = null;
  return `<ol class="board">${ps.map((p, i) => {
    if (p.score !== prev) { rank = i + 1; prev = p.score; }
    return `<li class="${rank === 1 ? 'first' : ''}" style="--c:${p.color}">
      <span class="bar" style="width:${Math.round(p.score / max * 100)}%"></span>
      <span class="rk">${rank}</span>${av(p, 'sm')}<span class="nm">${esc(p.name)}${p.id === myPid ? ' <span class="muted">(sen)</span>' : ''}</span><span class="sc">${p.score}</span>
    </li>`;
  }).join('')}</ol>`;
}
function viewRoundEnd() {
  const g = view.g, nextR = ROUNDS[Math.min(g.r, ROUNDS.length - 1)];
  const ids = g.order.filter(id => VP(id).connected), rc = ids.filter(id => view.ready[id]).length, iAmReady = !!view.ready[myPid];
  const willDouble = g.r === g.rounds.length - 1 && view.settings.finalDouble && g.rounds.length > 1;
  return `<section>
    <p class="kicker">Tur ${g.r} / ${g.rounds.length} bitti</p>
    <h2 class="big-title" style="font-size:clamp(40px,12vw,64px)">Ara skor</h2>
  </section>
  <section>${boardHTML()}</section>
  <section>
    <div class="next-up">Sıradaki tur: <b>${esc(g.rounds[g.r].name)}</b>. ${esc(nextR.desc)}${willDouble ? ' Puanlar iki kat, fark kapanabilir.' : ''}</div>
  </section>
  <section class="dock">
    <button class="btn primary big" data-act="ready" ${iAmReady ? 'disabled' : ''}>${iAmReady ? 'Diğerleri bekleniyor' : 'Hazırım'}</button>
    <div class="count">${rc}/${ids.length} kişi hazır</div>${isHost() && rc < ids.length ? '<div class="count"><button class="link" data-act="force">Beklemeden başlat</button></div>' : ''}
  </section>`;
}

/* ---------- Final ---------- */
function finalStats() {
  const ps = view.players;
  const base = ps.reduce((a, p) => a + p.st.base, 0), max = ps.reduce((a, p) => a + p.st.max, 0);
  const pct = max ? Math.round(base / max * 100) : 0;
  const tier = [...TIERS].reverse().find(t => pct >= t[0]);
  const sorted = [...ps].sort((a, b) => b.score - a.score);
  const top = sorted.filter(p => p.score === sorted[0].score);
  const hits = ps.reduce((a, p) => a + p.st.hit, 0);
  const best = [...ps].filter(p => p.st.max).sort((a, b) => (b.st.base / b.st.max) - (a.st.base / a.st.max))[0];
  return {pct, tier, top, hits, best, matches: view.g.matchTotal};
}
function viewFinal() {
  const f = finalStats(), host = isHost();
  const winner = f.top.length > 1 ? `🤝 Berabere: ${f.top.map(p => esc(p.name)).join(' ve ')}` : `🏆 ${esc(f.top[0].name)} kazandı`;
  const recap = view.history.map(h => `<li><b>${esc(h.q.text)}</b>${h.cards.map(c => {
      const G = VP(c.g), T = VP(c.t), cls = c.state !== 'done' ? 'no' : c.base === 2 ? 'ok' : c.base === 1 ? 'meh' : 'no';
      const mark = c.state !== 'done' ? '–' : c.base === 2 ? '✓' : c.base === 1 ? '≈' : '✗';
      return `<div class="rc"><div class="ans"><span class="who">${esc(T.avatar)} ${esc(T.name)}:</span> ${esc(showVal(h.q, c.ans) || '—')}</div>
        <div class="gs ${cls}">${esc(gen(G.name))} tahmini: ${esc(showVal(h.q, c.guess) || '—')} ${mark}</div></div>`;
    }).join('')}</li>`).join('');
  return `<section class="final">
    <svg class="wave" data-wave="final" data-pct="${f.pct}" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"><path class="wa"/><path class="wb"/></svg>
    <div class="pct">%${f.pct}</div>
    <div class="tier">${esc(f.tier[1])}</div>
    <p class="tier-d">${esc(f.tier[2])} Frekans uyumu, tüm tahminlerin ne kadar tuttuğunu gösterir.</p>
  </section>
  <section class="final">
    <h2 class="winner">${winner}</h2>
    ${boardHTML()}
    <div class="stats">
      <div class="stat"><b>${f.hits}</b><span>tam isabet</span></div>
      <div class="stat"><b>${f.matches}</b><span>aynı cevap</span></div>
      <div class="stat"><b>${f.best ? esc(f.best.avatar) : '–'}</b><span>${f.best ? 'en iyi okuyan: ' + esc(f.best.name) : 'en iyi okuyan'}</span></div>
    </div>
  </section>
  <section>
    <details class="recap"><summary>Tüm cevaplar (${view.history.length} soru)</summary><ol>${recap}</ol></details>
  </section>
  <section class="btn-row">
    ${host ? '<button class="btn primary big" data-act="rematch">Rövanş: yeni sorularla tekrar</button>' : '<div class="waiting"><div class="muted">Oda sahibi rövanş başlatabilir.</div></div>'}
    <button class="btn" data-act="copyResults">Sonuçları kopyala</button>
    <div style="text-align:center"><button class="link" data-act="leave">Odadan çık</button></div>
  </section>`;
}
function resultsText() {
  const f = finalStats(), ps = [...view.players].sort((a, b) => b.score - a.score);
  return `📡 Aynı Frekans sonuçları\n${ps.map((p, i) => `${i + 1}. ${p.avatar} ${p.name}: ${p.score} puan`).join('\n')}\nFrekans uyumu: %${f.pct} (${f.tier[1]})\n${f.matches} kez aynı cevap, ${f.hits} tam isabet.`;
}

/* =========================================================
   DALGA ÇİZİMİ — oyunun imzası: iki frekans hizalanıp ayrılıyor
   ========================================================= */
let waveRAF = null;
function drawWave(svg, t) {
  const W = 600, H = 120, mid = H / 2, amp = 38, k = 2 * Math.PI / 150;
  let delta;
  if (svg.dataset.wave === 'final') delta = (1 - (+svg.dataset.pct || 0) / 100) * Math.PI + .12 * Math.sin(t / 900);
  else delta = Math.PI * (.5 + .5 * Math.sin(t / 1700));
  const ph = t / 650;
  const path = off => {
    let d = '';
    for (let x = 0; x <= W; x += 5) {
      const env = Math.sin(Math.PI * x / W) ** .8;
      d += (x ? 'L' : 'M') + x + ' ' + (mid + amp * env * Math.sin(k * x - ph + off)).toFixed(1);
    }
    return d;
  };
  svg.querySelector('.wa').setAttribute('d', path(0));
  svg.querySelector('.wb').setAttribute('d', path(delta));
}
function startWaves() {
  const svgs = $$('svg[data-wave]');
  if (!svgs.length) return;
  if (reduced) { svgs.forEach(s => drawWave(s, 0)); return; }
  if (waveRAF) return;
  const loop = t => {
    const list = $$('svg[data-wave]');
    if (!list.length) { waveRAF = null; return; }
    list.forEach(s => drawWave(s, t));
    waveRAF = requestAnimationFrame(loop);
  };
  waveRAF = requestAnimationFrame(loop);
}

/* =========================================================
   KÜÇÜK ARAYÜZ PARÇALARI
   ========================================================= */
function toast(msg) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
  while (box.children.length > 3) box.firstChild.remove();
}
function floatEmoji(e) {
  if (!REACTS.includes(e)) return;
  const el = document.createElement('span');
  el.className = 'fl'; el.textContent = e;
  el.style.left = (8 + Math.random() * 84) + '%';
  el.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
  $('#floaters').appendChild(el);
  setTimeout(() => el.remove(), 2500);
  Sound.play('tap');
}
function showModal(html) { const m = $('#modal'); m.innerHTML = `<div class="box">${html}</div>`; m.classList.remove('hidden'); }
function hideModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
async function copy(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(okMsg); } catch { toast(text); }
  ta.remove();
}
function inviteLink() { return location.origin + location.pathname + '?oda=' + view.code; }
function confetti() {
  if (reduced) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = view ? view.players.map(p => p.color) : COLORS;
  const ps = Array.from({length: 140}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, s: 5 + Math.random() * 6,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)],
  }));
  const t0 = performance.now();
  const step = t => {
    const el = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - el / 3200);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (el < 3300) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(step);
}

// zamanlayıcı
setInterval(() => {
  const bar = $('#timebar');
  if (!view || view.phase !== 'answer' || !view.g.endsAt) { bar.classList.remove('on', 'low'); lastTick = -1; return; }
  const g = view.g, left = Math.max(0, g.endsAt + clockOffset - Date.now()), secs = Math.ceil(left / 1000);
  bar.classList.add('on'); bar.classList.toggle('low', left < 10000);
  bar.firstElementChild.style.width = (left / (g.dur * 1000) * 100) + '%';
  const se = $('#secs'); if (se) se.textContent = secs + ' sn';
  const submitted = !!g.subs[myPid];
  if (!submitted && secs <= 5 && secs > 0 && secs !== lastTick) { lastTick = secs; Sound.play('tick'); }
  const key = g.num + ':' + g.q.id;
  if (left <= 0 && !submitted && autoSentFor !== key && g.order.includes(myPid)) { autoSentFor = key; submitAnswer(true); toast('Süre doldu, yazdıkların gönderildi.'); }
}, 200);

/* =========================================================
   OLAY YÖNETİMİ
   ========================================================= */
function readName() {
  const el = $('#nameIn');
  if (el) { myName = cleanName(el.value); store.set('name', myName); }
  if (!myName) {
    if (el) { el.focus(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    toast('Önce adını yaz.');
    return false;
  }
  return true;
}
function pushSettings(patch) {
  const S = Object.assign({}, view.settings, patch);
  const match = Object.entries(MODES).find(([, m]) => m.packs.length === S.packs.length && m.packs.every(p => S.packs.includes(p)));
  if ('packs' in patch) S.mode = match ? match[0] : 'ozel';
  act('settings', {settings: S});
}

const handlers = {
  brand() { if (!view) return; showModal(`<h3>Odadan çıkılsın mı?</h3><p>${isHost() ? 'Oda kapanır ve herkesin bağlantısı kesilir.' : 'Oyundan ayrılırsın. Aynı kodla geri dönebilirsin.'}</p>
      <div class="row"><button class="btn primary" data-act="leaveNow">Odadan çık</button><button class="btn ghost" data-act="closeModal">Vazgeç</button></div>`); },
  leave() { handlers.brand(); },
  leaveNow() { hideModal(); leaveRoom(); },
  closeModal() { hideModal(); },
  retryNow() { retries = 0; hideModal(); connectGuest(true); },
  sound() { Sound.on = !Sound.on; store.set('sound', Sound.on); Sound.unlock(); Sound.play('tap'); updateChrome(); },
  pickAv(b) {
    myAvatar = b.dataset.av; store.set('avatar', myAvatar);
    $$('.avpick').forEach(x => { const on = x.dataset.av === myAvatar; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
  },
  cycleAv() {
    const taken = new Set(view.players.map(p => p.avatar));
    let i = AVATARS.indexOf(myAvatar);
    for (let n = 0; n < AVATARS.length; n++) { i = (i + 1) % AVATARS.length; if (!taken.has(AVATARS[i])) break; }
    myAvatar = AVATARS[i]; store.set('avatar', myAvatar); act('profile', {avatar: myAvatar});
  },
  create() { if (readName()) { homeError = ''; createRoom(); } },
  join() {
    if (!readName()) return;
    const code = ($('#codeIn').value || '').replace(/\D/g, '');
    if (code.length !== 6) { toast('Kod 6 haneli olmalı.'); $('#codeIn').focus(); return; }
    homeError = ''; joinRoom(code);
  },
  joinInvite() { if (readName()) { homeError = ''; joinRoom(inviteCode); } },
  dropInvite() { readName(); inviteCode = ''; try { history.replaceState(null, '', location.pathname); } catch {} lastKey = ''; render(); },
  copyCode() { if (view) copy(view.code, 'Kod kopyalandı'); },
  copyLink() { copy(inviteLink(), 'Davet linki kopyalandı'); },
  share() { navigator.share({title: 'Aynı Frekans', text: `Aynı Frekans oynayalım mı? Oda kodu: ${fmtCode(view.code)}`, url: inviteLink()}).catch(() => {}); },
  mode(b) { const m = MODES[b.dataset.v]; if (m) act('settings', {settings: Object.assign({}, view.settings, {mode: b.dataset.v, packs: m.packs.slice()})}); },
  pack(b) {
    const S = view.settings, id = b.dataset.v;
    pushSettings({packs: S.packs.includes(id) ? S.packs.filter(x => x !== id) : [...S.packs, id]});
  },
  set(b) { pushSettings({[b.dataset.k]: b.dataset.v}); },
  toggle(b) { pushSettings({[b.dataset.k]: !view.settings[b.dataset.k]}); },
  start() { act('start'); },
  opt(b) {
    const kind = b.dataset.kind; draft[kind] = +b.dataset.v;
    $$(`.opt[data-kind="${kind}"]`).forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
    Sound.play('tap');
    const e = $('#formErr'); if (e) e.textContent = '';
  },
  x2() { draft.x2 = !draft.x2; patchAnswer(); Sound.play('tap'); },
  swap() { act('swap'); },
  submit() { submitAnswer(false); },
  unsubmit() { act('unsubmit'); },
  judge(b) { act('judge', {v: +b.dataset.v}); },
  ready() { act('ready'); Sound.play('tap'); },
  force() { act('force'); },
  react(b) { sendReact(b.dataset.e); },
  rematch() { act('rematch'); },
  copyResults() { copy(resultsText(), 'Sonuçlar kopyalandı'); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const h = handlers[b.dataset.act];
  if (h) { e.preventDefault(); h(b, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'codeIn') {
    const digits = t.value.replace(/\D/g, '').slice(0, 6);
    if (t.value !== digits) t.value = digits;
    return;
  }
  if (t.id === 'nameIn') { myName = cleanName(t.value); store.set('name', myName); return; }
  const kind = t.dataset.in; if (!kind) return;
  if (t.type === 'range') {
    draft[kind] = +t.value; t.style.setProperty('--p', t.value * 10 + '%');
    const o = $(`[data-out="${kind}"]`); if (o) o.textContent = t.value;
  } else {
    draft[kind] = t.value;
    const er = $('#formErr'); if (er) er.textContent = '';
  }
});
document.addEventListener('paste', e => {
  if (e.target.id !== 'codeIn') return;
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  const m = txt.match(/(?:oda=)?(\d{3}\s?\d{3})/);
  if (m) { e.preventDefault(); e.target.value = m[1].replace(/\D/g, ''); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'codeIn') { e.preventDefault(); handlers.join(); }
  else if (t.id === 'nameIn') { e.preventDefault(); inviteCode ? handlers.joinInvite() : (($('#codeIn') && $('#codeIn').value.length === 6) ? handlers.join() : handlers.create()); }
  else if (t.dataset.in === 'mine' && t.type !== 'range') { e.preventDefault(); const gi = $('[data-in="guess"]'); gi && gi.focus(); }
  else if (t.dataset.in === 'guess' && t.type !== 'range') { e.preventDefault(); submitAnswer(false); }
});

/* =========================================================
   BAŞLAT
   ========================================================= */
render();
if (inviteCode && ss.get('joined') === inviteCode && myName) joinRoom(inviteCode); // sayfa yenilendiyse odaya geri dön
</script>
</body>
